name: sign-checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose checksums.txt should be signed, e.g. v0.1.5
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check that checksums.txt is attached to the release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # The release pipeline attaches the assets while the release is still a draft, so they are
          # already present when this runs; the retry only absorbs GitHub API lag. A release published
          # by any other route has nothing to sign, so the job stops quietly rather than failing.
          $found = $false
          foreach ($attempt in 1..6) {
            $assets = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>$null
            if (@($assets) -contains 'checksums.txt') { $found = $true; break }
            Start-Sleep -Seconds 10
          }
          "found=$($found.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $found) {
            Write-Host "::warning::No checksums.txt attached to release $env:TAG, nothing to sign."
          }

      - name: Install cosign
        if: steps.check.outputs.found == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign checksums.txt
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern checksums.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download checksums.txt from $env:TAG" }

          cosign sign-blob checksums.txt --bundle checksums.txt.sigstore.json --yes
          if ($LASTEXITCODE -ne 0) { throw 'cosign sign-blob failed' }

      - name: Verify the signature before publishing it
        if: steps.check.outputs.found == 'true'
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-checksums.yml@${{ github.ref }}
        run: |
          cosign verify-blob checksums.txt `
            --bundle checksums.txt.sigstore.json `
            --certificate-identity $env:CERT_IDENTITY `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          if ($LASTEXITCODE -ne 0) { throw 'cosign verify-blob failed, the signature will not be published' }

      - name: Attach the signature to the release
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG checksums.txt.sigstore.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the signature to $env:TAG" }
