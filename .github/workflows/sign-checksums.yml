name: sign-checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose checksums.txt should be signed, e.g. v0.1.5
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --clobber
          cosign sign-blob checksums.txt --bundle checksums.txt.sigstore.json --yes

      - name: Verify the signature before publishing it
        run: |
          set -euo pipefail
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/sign-checksums.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attach the signature to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" checksums.txt.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
