name: sign-checksums

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose checksums.txt should be signed, e.g. v0.1.5
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out signing helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check that checksums.txt is attached to the release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          $script = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath '.github' -AdditionalChildPath 'scripts', 'Get-ReleaseChecksum.ps1'
          & $script -Mode Check -Repository $env:GITHUB_REPOSITORY -Tag $env:TAG -EventReleaseId $env:EVENT_RELEASE_ID

      - name: Install cosign
        if: steps.check.outputs.found == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign checksums.txt
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          ASSET_ID: ${{ steps.check.outputs.asset_id }}
          ASSET_SIZE: ${{ steps.check.outputs.asset_size }}
        run: |
          $script = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath '.github' -AdditionalChildPath 'scripts', 'Get-ReleaseChecksum.ps1'
          & $script -Mode Download -Repository $env:GITHUB_REPOSITORY -AssetId $env:ASSET_ID -AssetSize $env:ASSET_SIZE

          cosign sign-blob checksums.txt --bundle checksums.txt.sigstore.json --yes
          if ($LASTEXITCODE -ne 0) { throw 'cosign sign-blob failed' }

      - name: Verify the signature before publishing it
        if: steps.check.outputs.found == 'true'
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-checksums.yml@${{ github.ref }}
        run: |
          cosign verify-blob checksums.txt `
            --bundle checksums.txt.sigstore.json `
            --certificate-identity $env:CERT_IDENTITY `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          if ($LASTEXITCODE -ne 0) { throw 'cosign verify-blob failed, the signature will not be published' }

      - name: Attach the signature to the release
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG checksums.txt.sigstore.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the signature to $env:TAG" }
