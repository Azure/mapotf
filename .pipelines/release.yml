parameters:
  - name: version
    displayName: Release version (e.g. v0.1.5)
    type: string
  - name: artifactBuildId
    displayName: Artifact source build id (0 builds from this run)
    type: number
    default: 0

variables:
  # Placeholders that must be set when the pipeline is registered in ADO.
  # pipelineId must equal this pipeline's own definition id, or re-running the
  # release stage against a prior build (artifactBuildId) will fail.
  - name: pipelineId
    value: 0
  - name: poolName
    value: pool-ubuntu-2404
  - name: goVersion
    value: 1.26.5
  - group: AME ESRP Variable Group

stages:
  - ${{ if eq(parameters.artifactBuildId, 0) }}:
      - stage: test
        displayName: "[AVM] Test"
        pool:
          name: $(poolName)
        jobs:
          - job: test
            displayName: "[AVM] Run unit tests"
            steps:
              - task: GoTool@0
                displayName: "[AVM] Install Go"
                inputs:
                  version: $(goVersion)
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  go test ./...
                  if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
                displayName: "[AVM] Go test"

      - stage: build
        displayName: "[AVM] Build mapotf"
        dependsOn: test
        pool:
          name: $(poolName)
        jobs:
          - job: build
            displayName: "[AVM] Build binaries"
            strategy:
              matrix:
                linux-amd64:
                  OS: linux
                  ARCH: amd64
                linux-arm64:
                  OS: linux
                  ARCH: arm64
                darwin-amd64:
                  OS: darwin
                  ARCH: amd64
                darwin-arm64:
                  OS: darwin
                  ARCH: arm64
                windows-amd64:
                  OS: windows
                  ARCH: amd64
                windows-arm64:
                  OS: windows
                  ARCH: arm64
            steps:
              - task: GoTool@0
                displayName: "[AVM] Install Go"
                inputs:
                  version: $(goVersion)
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $version = $env:VERSION -replace '^v', ''
                  $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
                  $binary = if ($env:GOOS -eq 'windows') { 'mapotf.exe' } else { 'mapotf' }
                  New-Item -ItemType Directory -Force -Path build | Out-Null
                  $ldflags = '-s -w ' +
                    "-X github.com/Azure/mapotf/cmd.version=$version " +
                    "-X github.com/Azure/mapotf/cmd.commit=$env:COMMIT " +
                    "-X github.com/Azure/mapotf/cmd.date=$date"
                  go build -trimpath -ldflags $ldflags -o "build/$binary" .
                  if ($LASTEXITCODE -ne 0) { throw "go build failed for $env:GOOS/$env:GOARCH" }
                displayName: "[AVM] Go build"
                env:
                  GOOS: $(OS)
                  GOARCH: $(ARCH)
                  CGO_ENABLED: 0
                  VERSION: ${{ parameters.version }}
                  COMMIT: $(Build.SourceVersion)
              - task: UseDotNet@2
                displayName: "[AVM] Install .NET SDK"
                condition: eq(variables.OS, 'windows')
                inputs:
                  packageType: sdk
                  version: 6.x
              - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
                displayName: "[AVM] ESRP sign Windows binary"
                condition: eq(variables.OS, 'windows')
                inputs:
                  ConnectedServiceName: $(ESRPServiceConnectionName)
                  AppRegistrationClientId: $(ESRPAppClientId)
                  AppRegistrationTenantId: $(ESRPAppTenantId)
                  AuthAKVName: $(ESRPKVName)
                  AuthCertName: $(ESRPAuthCertName)
                  AuthSignCertName: $(ESRPSignCertName)
                  FolderPath: "$(system.defaultWorkingDirectory)/build"
                  Pattern: "*.exe"
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-230012",
                        "OperationCode": "SigntoolSign",
                        "Parameters": {
                          "OpusName": "Microsoft",
                          "OpusInfo": "http://www.microsoft.com",
                          "PageHash": "/NPH",
                          "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256",
                          "FileDigest": "/fd \"SHA256\""
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      },
                      {
                        "KeyCode": "CP-230012",
                        "OperationCode": "SigntoolVerify",
                        "Parameters": {},
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: "60"
                  MaxConcurrency: "50"
                  MaxRetryAttempts: "5"
              - task: PublishPipelineArtifact@1
                displayName: "[AVM] Publish binary"
                inputs:
                  targetPath: "$(system.defaultWorkingDirectory)/build"
                  artifactName: "$(OS)-$(ARCH)"

  - stage: release
    displayName: "[AVM] Publish draft GitHub release"
    ${{ if eq(parameters.artifactBuildId, 0) }}:
      dependsOn: build
    ${{ else }}:
      dependsOn: []
    pool:
      name: $(poolName)
    jobs:
      - job: release
        displayName: "[AVM] Package, sign and release"
        steps:
          - ${{ if eq(parameters.artifactBuildId, 0) }}:
              - task: DownloadPipelineArtifact@2
                displayName: "[AVM] Download binaries"
                inputs:
                  path: "$(system.defaultWorkingDirectory)/dist"
          - ${{ else }}:
              - task: DownloadPipelineArtifact@2
                displayName: "[AVM] Download binaries from prior build"
                inputs:
                  path: "$(system.defaultWorkingDirectory)/dist"
                  source: specific
                  project: $(System.TeamProject)
                  pipeline: $(pipelineId)
                  runVersion: specific
                  runId: ${{ parameters.artifactBuildId }}

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $version = $env:VERSION -replace '^v', ''
              $combos = @(
                @{ os = 'linux'; arch = 'amd64' }
                @{ os = 'linux'; arch = 'arm64' }
                @{ os = 'darwin'; arch = 'amd64' }
                @{ os = 'darwin'; arch = 'arm64' }
                @{ os = 'windows'; arch = 'amd64' }
                @{ os = 'windows'; arch = 'arm64' }
              )
              New-Item -ItemType Directory -Force -Path release, staging | Out-Null
              foreach ($c in $combos) {
                $binary = if ($c.os -eq 'windows') { 'mapotf.exe' } else { 'mapotf' }
                $stage = Join-Path 'staging' "$($c.os)_$($c.arch)"
                New-Item -ItemType Directory -Force -Path $stage | Out-Null
                Copy-Item (Join-Path 'dist' "$($c.os)-$($c.arch)" $binary) $stage
                Copy-Item 'LICENSE', 'README.md' $stage
                $base = "mapotf_${version}_$($c.os)_$($c.arch)"
                if ($c.os -eq 'windows') {
                  Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path 'release' "$base.zip")
                } else {
                  chmod +x (Join-Path $stage $binary)
                  tar -czf (Join-Path 'release' "$base.tar.gz") -C $stage $binary LICENSE README.md
                  if ($LASTEXITCODE -ne 0) { throw "tar failed for $base" }
                }
              }
              $checksums = Get-ChildItem -Path 'release' -File | Sort-Object Name | ForEach-Object {
                '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
              }
              $checksumPath = Join-Path 'release' 'checksums.txt'
              Set-Content -Path $checksumPath -Value $checksums
              Copy-Item $checksumPath "$checksumPath.sig"
              Get-ChildItem -Path 'release' | Format-Table Name, Length
            displayName: "[AVM] Package archives and checksums"
            env:
              VERSION: ${{ parameters.version }}

          - task: UseDotNet@2
            displayName: "[AVM] Install .NET SDK"
            inputs:
              packageType: sdk
              version: 6.x

          - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
            displayName: "[AVM] ESRP sign checksums"
            inputs:
              ConnectedServiceName: $(ESRPServiceConnectionName)
              AppRegistrationClientId: $(ESRPAppClientId)
              AppRegistrationTenantId: $(ESRPAppTenantId)
              AuthAKVName: $(ESRPKVName)
              AuthCertName: $(ESRPAuthCertName)
              AuthSignCertName: $(ESRPSignCertName)
              FolderPath: "$(system.defaultWorkingDirectory)/release"
              Pattern: "checksums.txt.sig"
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  {
                    "KeyCode": "CP-461163-Pgp",
                    "OperationCode": "LinuxSign",
                    "Parameters": {},
                    "ToolName": "sign",
                    "ToolVersion": "1.0"
                  }
                ]
              SessionTimeout: "60"
              MaxConcurrency: "50"
              MaxRetryAttempts: "5"

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $sig = Join-Path 'release' 'checksums.txt.sig'
              if (-not (Test-Path $sig)) { throw "Signature file not found: $sig" }
              gpg --dearmor $sig
              if ($LASTEXITCODE -ne 0) { throw 'gpg --dearmor failed' }
              Move-Item "$sig.gpg" $sig -Force
              Get-ChildItem -Path 'release' | Format-Table Name, Length
            displayName: "[AVM] Dearmor signature"

          - task: GitHubRelease@1
            displayName: "[AVM] Create draft GitHub release"
            inputs:
              gitHubConnection: Azure
              repositoryName: $(Build.Repository.Name)
              action: create
              target: $(Build.SourceVersion)
              tagSource: gitTag
              tagPattern: '^v\d+\.\d+\.\d+'
              assets: "$(system.defaultWorkingDirectory)/release/*"
              isDraft: true
              addChangeLog: false
